name: Pack and upload artifacts
description: >
  Uploads an artifacts directory as a single tarball. must-gather names files after object names, which can contain
  colons that upload-artifact rejects, so the directory goes up packed.

inputs:
  name:
    description: Name to upload the artifact under.
    required: true
  directory:
    description: Directory to pack and upload.
    required: true
  retention-days:
    description: Retention for the uploaded artifact, in days.
    required: false
    default: "14"

runs:
  using: composite
  steps:
    - name: Pack artifacts
      id: pack
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        # The directory only exists once the suite ran, so an earlier failure would otherwise fail this step too.
        mkdir -p "${DIRECTORY}"

        tar -cf "${RUNNER_TEMP}/artifacts.tar" -C "${DIRECTORY}" .

        # In a job container, the runner.temp context holds the host path rather than the one the tarball was written to.
        echo "path=${RUNNER_TEMP}/artifacts.tar" | tee -a "${GITHUB_OUTPUT}"

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.pack.outputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn
